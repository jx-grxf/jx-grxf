name: Contribution snake

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  # schedule and workflow_dispatch only register from the default branch, so
  # editing this file is the way to rebuild the images from a feature branch.
  push:
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the contribution graph
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/snake.svg && test -s dist/snake-dark.svg
          # The render step runs in a container, so dist/ belongs to root and a
          # git init inside it is denied. Copy the two files out first.
          out="${RUNNER_TEMP}/snake"
          mkdir -p "$out"
          cp dist/snake.svg dist/snake-dark.svg "$out/"
          cd "$out"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg snake-dark.svg
          git commit -q -m "chore: refresh contribution snake"
          # An orphan force-push keeps `output` at one commit instead of growing
          # a new history entry every night.
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
