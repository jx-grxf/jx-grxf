name: Profile assets

on:
  push:
    paths:
      - README.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/profile-assets.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/**
      - tests/**
      - .github/workflows/profile-assets.yml
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/profile.py --check

  refresh:
    needs: verify
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Refresh public releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/profile.py --refresh
      - run: python3 scripts/profile.py --check
      - name: Commit changed release data
        run: |
          git add assets/releases.json assets/releases*.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public release board"
          git push
