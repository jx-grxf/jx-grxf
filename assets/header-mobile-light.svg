<svg xmlns="http://www.w3.org/2000/svg" width="480" height="338" viewBox="0 0 480 338" role="img" aria-labelledby="title desc">
<title id="title">Johannes Grof — native by nature</title>
<desc id="desc">Student developer in Austria. Native Mac apps, useful tools and curious detours. A small train arrives along the bottom of the window.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #192c25; }
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
.muted { fill: #50675c; }
.accent { fill: #286c40; }
.enter { animation: enter .8s ease-out both; }
.train { animation: journey 3.6s cubic-bezier(.25,.65,.25,1) both; }
.cursor { animation: blink 1s step-end 3; }
@keyframes enter { from { transform: translateY(5px); } to { transform: translateY(0); } }
@keyframes journey { from { transform: translateX(0); } to { transform: translateX(350px); } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .enter, .train, .cursor { animation: none; }
  .train { transform: translateX(350px); }
}
</style>
<rect x="1" y="1" width="478" height="336" rx="20" fill="#f6f8f4" stroke="#c9d6cc"/>

<path d="M1 54H479" stroke="#c9d6cc"/>
<circle cx="26" cy="28" r="5" fill="#ef7970"/>
<circle cx="44" cy="28" r="5" fill="#e6bf63"/>
<circle cx="62" cy="28" r="5" fill="#78c990"/>
<text x="258" y="33" text-anchor="middle" class="mono muted" font-size="12">johannes — ~/workbench</text>
<g class="enter">
<text x="32" y="96" class="mono accent" font-size="13" letter-spacing="2">MADE IN AUSTRIA</text>
<text x="30" y="151" font-size="38" font-weight="700" letter-spacing="-1.8">Native by nature.</text>
<text x="32" y="187" class="muted" font-size="18">Mac apps. Useful tools. Curious detours.</text>
<text x="32" y="222" class="mono accent" font-size="15">mac 4 life.<tspan class="cursor"> ▍</tspan></text>
</g>

<path d="M32 278H448" stroke="#a9c3b0" stroke-width="3"/>
<g fill="#f6f8f4" stroke="#286c40" stroke-width="2">
<circle cx="40" cy="278" r="5"/><circle cx="240" cy="278" r="5"/><circle cx="440" cy="278" r="5"/>
</g>
<g class="train">
<rect x="35" y="261" width="54" height="20" rx="6" fill="#286c40"/>
<path d="M44 267h9m5 0h9m5 0h9" stroke="#f6f8f4" stroke-width="4"/>
<circle cx="47" cy="283" r="3" fill="#192c25"/><circle cx="78" cy="283" r="3" fill="#192c25"/>
</g>
<text x="32" y="314" class="mono muted" font-size="12">01 / BUILD</text>
<text x="240" y="314" text-anchor="middle" class="mono muted" font-size="12">02 / LEARN</text>
<text x="448" y="314" text-anchor="end" class="mono muted" font-size="12">03 / REPEAT</text>

</svg>
