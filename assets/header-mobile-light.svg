<title id="t">Johannes Grof — software that does one thing, properly</title>
<desc id="d">Johannes Grof, developer in Austria. Software that does one thing, properly. Native Mac and iPhone apps, developer tools and the backends that keep them running. Six marks for the kinds of things he builds, and a live strip: 33 public repositories, 49 releases shipped, latest BriskEdit v0.6.0.</desc>
