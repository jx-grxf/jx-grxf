<svg xmlns="http://www.w3.org/2000/svg" width="960" height="338" viewBox="0 0 960 338" role="img" aria-labelledby="title desc">
<title id="title">Johannes Grof — native by nature</title>
<desc id="desc">Student developer in Austria. Native Mac apps, useful tools and curious detours. A small train arrives along the bottom of the window.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #eef5f1; }
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
.muted { fill: #a2b5af; }
.accent { fill: #a5edb1; }
.enter { animation: enter .8s ease-out both; }
.train { animation: journey 3.6s cubic-bezier(.25,.65,.25,1) both; }
.cursor { animation: blink 1s step-end 3; }
@keyframes enter { from { transform: translateY(5px); } to { transform: translateY(0); } }
@keyframes journey { from { transform: translateX(0); } to { transform: translateX(830px); } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .enter, .train, .cursor { animation: none; }
  .train { transform: translateX(830px); }
}
</style>
<rect x="1" y="1" width="958" height="336" rx="20" fill="#0d1416" stroke="#2b3c3d"/>

<path d="M1 54H959" stroke="#2b3c3d"/>
<circle cx="26" cy="28" r="5" fill="#ef7970"/>
<circle cx="44" cy="28" r="5" fill="#e6bf63"/>
<circle cx="62" cy="28" r="5" fill="#78c990"/>
<text x="498" y="33" text-anchor="middle" class="mono muted" font-size="12">johannes — ~/workbench</text>
<g class="enter">
<text x="32" y="96" class="mono accent" font-size="13" letter-spacing="2">MADE IN AUSTRIA</text>
<text x="30" y="151" font-size="52" font-weight="700" letter-spacing="-1.8">Native by nature.</text>
<text x="32" y="187" class="muted" font-size="18">Mac apps. Useful tools. Curious detours.</text>
<text x="32" y="222" class="mono accent" font-size="15">mac 4 life.<tspan class="cursor"> ▍</tspan></text>
</g>

<rect x="658" y="82" width="270" height="156" rx="14" fill="#141f21" stroke="#2b3c3d"/>
<text x="680" y="110" class="mono muted" font-size="12" letter-spacing="1">CURRENT FOCUS</text>
<text x="679" y="151" font-size="34" font-weight="650">ÖffiGo</text>
<text x="680" y="183" class="muted" font-size="15">Austria, one connection at a time.</text>
<circle cx="685" cy="212" r="4" fill="#a5edb1"/>
<text x="698" y="217" class="mono accent" font-size="12">iPHONE + APPLE WATCH</text>

<path d="M32 278H928" stroke="#38564a" stroke-width="3"/>
<g fill="#0d1416" stroke="#a5edb1" stroke-width="2">
<circle cx="40" cy="278" r="5"/><circle cx="480" cy="278" r="5"/><circle cx="920" cy="278" r="5"/>
</g>
<g class="train">
<rect x="35" y="261" width="54" height="20" rx="6" fill="#a5edb1"/>
<path d="M44 267h9m5 0h9m5 0h9" stroke="#0d1416" stroke-width="4"/>
<circle cx="47" cy="283" r="3" fill="#eef5f1"/><circle cx="78" cy="283" r="3" fill="#eef5f1"/>
</g>
<text x="32" y="314" class="mono muted" font-size="14">01 / BUILD</text>
<text x="480" y="314" text-anchor="middle" class="mono muted" font-size="14">02 / LEARN</text>
<text x="928" y="314" text-anchor="end" class="mono muted" font-size="14">03 / REPEAT</text>

</svg>
